<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if page.title %}
      {{ page.title | escape }}
    {% else %}
      {{ site.title | escape }}
    {% endif %}
  </title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}"/>

  <link rel="icon" href='{{ "/resources/img/favicon.ico" | relative_url }}'>

  <script src='{{ "/resources/lib/jquery/jquery-3.6.1.min.js" | relative_url }}'></script>
  <link rel="stylesheet" href='{{ "/assets/main.css" | relative_url }}'>
  <script src='{{ "/resources/lib/bootstrap/js/bootstrap.min.js" | relative_url }}'></script>
  <script src='{{ "/resources/lib/highlight/highlight.pack.js" | relative_url }}'></script>
</head>

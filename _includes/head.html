<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:image" content='{{ "/resources/img/og-image.jpg" | relative_url }}' />
  <meta name="twitter:widgets:border-color" content="#55acee">

  <title>
    {% if page.title %}
      {{ page.title | escape }}
    {% else %}
      {{ site.title | escape }}
    {% endif %}
  </title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}"/>

  {% if page.canonical_url %}
  <link rel="canonical" href="{{ page.canonical_url | absolute_url }}">
  {% else %}
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  {% endif %}

  <link rel="icon" id="favicon" href='{{ "/resources/img/favicon/favicon-light/favicon-light.ico " | relative_url }}'>

  <link rel="manifest" href='{{ "/resources/img/favicon/site.webmanifest" | relative_url }}'>
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">

  <script src='{{ "/resources/lib/jquery/jquery-3.6.1.min.js" | relative_url }}'></script>
  <link rel="stylesheet" href='{{ "/assets/main.css" | relative_url }}'>
  <script src='{{ "/resources/lib/bootstrap/js/bootstrap.min.js" | relative_url }}'></script>
  <script src='{{ "/resources/lib/sticky-sidebar/resizeSensor.js" | relative_url }}'></script>
  <script src='{{ "/resources/lib/sticky-sidebar/sticky-sidebar.min.js" | relative_url }}'></script>
  <script src='{{ "/resources/lib/highlight/highlight.pack.js" | relative_url }}'></script>
  <script src='{{ "/resources/lib/purl/purl.js" | relative_url }}'></script>
  <script async defer src="https://buttons.github.io/buttons.js"></script>
</head>

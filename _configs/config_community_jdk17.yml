# Build settings
markdown: kramdown
# theme: minima
plugins:
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-sitemap

exclude:
  - _site
  - jdk25.4
  - jdk25
  - jdk21
  - jdk17
  - dev
  - pages/native-image/libraries-and-frameworks-with-header.md
  - ci.jsonnet
  - release-notes/enterprise
  - docs/enterprise-overview
  - docs/getting-started/graalvm-enterprise
  - docs/reference-manual.md
  - docs/README.md
  - robots-ohc.txt
  - robots-original.txt
  - original_website_index.md
  - sp_common
  - Gemfile
  - Gemfile.lock
  - README.md
  - repos
  - vendor
  - Dockerfile
  - "*.sh"
  - "*.rb"
  - "*.py"

kramdown:
  input: GFM
  syntax_highlighter: none
  syntax_highlighter_opts:
    disable: true

plugins_dir:
  - _plugins

autoprefixer:
  browsers:
  - last 3 versions
  only_production: true

defaults:
  sitemap: true

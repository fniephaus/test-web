name: Build and publish website

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Jekyll source
        uses: actions/checkout@v4
        with:
          ref: jekyll-build
          path: source

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: source

      - name: Install website dependencies
        working-directory: source
        run: bundle install

      - name: Build website
        working-directory: source
        env:
          GRAAL_REPOSITORY: https://github.com/oracle/graal.git
        run: ./_scripts/build-website.sh

      - name: Check out Javadoc 25.4
        uses: actions/checkout@v4
        with:
          ref: javadoc/25.4
          path: 25.4/javadoc
          fetch-depth: 1

      - name: Check out Javadoc 25.0
        uses: actions/checkout@v4
        with:
          ref: javadoc/25.0
          path: 25.0/javadoc
          fetch-depth: 1

      - name: Check out Javadoc 23.1
        uses: actions/checkout@v4
        with:
          ref: javadoc/23.1
          path: 23.1/javadoc
          fetch-depth: 1

      - name: Check out Javadoc 23.0
        uses: actions/checkout@v4
        with:
          ref: javadoc/23.0
          path: 23.0/javadoc
          fetch-depth: 1

      - name: Add Javadocs to generated site
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          for version in 25.4 25.0 23.1 23.0; do
            checkout_directory="${GITHUB_WORKSPACE}/${version}/javadoc"
            destination="_site/${version}/javadoc"

            if [[ -d "${checkout_directory}/${version}/javadoc" ]]; then
              javadoc_directory="${checkout_directory}/${version}/javadoc"
            elif [[ -d "${checkout_directory}/javadoc" ]]; then
              javadoc_directory="${checkout_directory}/javadoc"
            else
              javadoc_directory="${checkout_directory}"
            fi

            if ! find "${javadoc_directory}" -mindepth 1 -maxdepth 1 ! -name .git -print -quit | grep -q .; then
              echo "No Javadoc content found for ${version} in javadoc/${version}." >&2
              exit 1
            fi

            mkdir -p "${destination}"
            rsync --archive --delete --exclude='.git/' "${javadoc_directory}/" "${destination}/"
          done

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: source/_site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Jekyll source
        uses: actions/checkout@v4
        with:
          ref: jekyll-build
          path: source

      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: deploy

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: site

      - name: Publish generated site to master
        env:
          SITE_DIRECTORY: ${{ github.workspace }}/site
          SOURCE_DIRECTORY: ${{ github.workspace }}/source
          DEPLOY_DIRECTORY: ${{ github.workspace }}/deploy
        shell: bash
        run: |
          set -euo pipefail

          # Keep content generated by other jobs and repositories in master.
          # _rsync-excluded lists all deployment-owned paths and protects them from --delete.
          rsync --archive --verbose --delete \
            --exclude-from="$SOURCE_DIRECTORY/_rsync-excluded" \
            --exclude='/javascript/' \
            --exclude='/.github/' \
            "$SITE_DIRECTORY/" "$DEPLOY_DIRECTORY/"

          # GitHub Pages serves the generated files as-is.
          touch "$DEPLOY_DIRECTORY/.nojekyll"

          cd "$DEPLOY_DIRECTORY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all

          if git diff --cached --quiet; then
            echo 'No generated changes to publish.'
            exit 0
          fi

          git commit -m 'Build website from jekyll-build'
          git push origin HEAD:master

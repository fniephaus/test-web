name: Build and publish website

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Jekyll source
        uses: actions/checkout@v4
        with:
          ref: jekyll-build
          path: source

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: source

      - name: Install website dependencies
        working-directory: source
        run: bundle install

      - name: Build website
        working-directory: source
        run: ./_scripts/build-website.sh

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: source/_site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Jekyll source
        uses: actions/checkout@v4
        with:
          ref: jekyll-build
          path: source

      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: deploy

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: site

      - name: Publish generated site to master
        env:
          SITE_DIRECTORY: ${{ github.workspace }}/site
          SOURCE_DIRECTORY: ${{ github.workspace }}/source
          DEPLOY_DIRECTORY: ${{ github.workspace }}/deploy
        shell: bash
        run: |
          set -euo pipefail

          # Keep content generated by other jobs and repositories in master.
          # _rsync-excluded lists all deployment-owned paths and protects them from --delete.
          rsync --archive --verbose --delete \
            --exclude-from="$SOURCE_DIRECTORY/_rsync-excluded" \
            --exclude='/javascript/' \
            --exclude='/.github/' \
            "$SITE_DIRECTORY/" "$DEPLOY_DIRECTORY/"

          # GitHub Pages serves the generated files as-is.
          touch "$DEPLOY_DIRECTORY/.nojekyll"

          cd "$DEPLOY_DIRECTORY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all

          if git diff --cached --quiet; then
            echo 'No generated changes to publish.'
            exit 0
          fi

          git commit -m 'Build website from jekyll-build'
          git push origin HEAD:master

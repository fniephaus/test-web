name: Deploy graalvm.org

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: publish-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'

      - name: Install dependencies
        run: bundle install

      - name: Build website
        run: ./_scripts/build-website.sh

      - name: Upload generated site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graalvm.org-website
          path: _site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref_name == 'main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - name: Check out gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download generated site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graalvm.org-website
          path: site

      - name: Merge site into gh-pages
        run: |
          # Keep content generated by other jobs and repositories in gh-pages.
          # _rsync-excluded lists all deployment-owned paths and protects them from --delete.
          rsync --archive --verbose --delete \
            --exclude-from="${{ github.workspace }}/source/_rsync-excluded" \
            "${{ github.workspace }}/site/" "${{ github.workspace }}/gh-pages/"

          cd "${{ github.workspace }}/gh-pages"
          git add --all

          if git diff --cached --quiet; then
            echo 'No generated changes to publish.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update website on $(date)"
          git push origin gh-pages

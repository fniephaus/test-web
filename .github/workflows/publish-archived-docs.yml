name: Build archived docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Archived documentation version to build
        type: string
        required: true
      publish:
        description: Publish the selected version to gh-pages (default branch only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out archived docs source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: archived-docs
          path: archived-docs

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'

      - name: Install archived site dependencies
        working-directory: archived-docs
        run: bundle install

      - name: Build archived documentation
        working-directory: archived-docs
        env:
          DOCS_VERSION: ${{ inputs.version }}
        run: bash _scripts/build.sh "$DOCS_VERSION"

      - name: Upload archived site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archived-docs-${{ inputs.version }}
          path: archived-docs/${{ inputs.version }}
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-website
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download archived site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archived-docs-${{ inputs.version }}
          path: ${{ runner.temp }}/archived-docs

      - name: Update selected archived version
        env:
          DOCS_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          destination="$GITHUB_WORKSPACE/gh-pages/$DOCS_VERSION"
          mkdir -p "$destination"

          # Retain any Javadocs published into the same version directory.
          rsync --archive --verbose --delete \
            --exclude='javadoc/' \
            "$RUNNER_TEMP/archived-docs/" "$destination/"

          cd "$GITHUB_WORKSPACE/gh-pages"
          git add --all -- "$DOCS_VERSION"

          if git diff --cached --quiet -- "$DOCS_VERSION"; then
            echo "No archived documentation changes for $DOCS_VERSION."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update archived docs $DOCS_VERSION on $(date -u +'%Y-%m-%d')"
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages

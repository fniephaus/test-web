<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {% include head.html %}
  <body class="preload">
    <div {% if page.url != "/" %} class="wrapper wrapper--nofooter" {% else %} class="wrapper" {% endif %}>
      {% include header.html %}
      <main {% if page.url == "/" %} class="content content--home" {% else %} class="content" {% endif %}  aria-label="Content">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <div class="overlay"></div>
    <script src='{{ "/resources/lib/slick-slider/slick.min.js" | relative_url }}'></script>
    <script src='{{ "/resources/js/main.js" | relative_url }}'></script>
    <script src='{{ "/resources/js/favicon.js" | relative_url }}'></script>
  </body>
</html>
